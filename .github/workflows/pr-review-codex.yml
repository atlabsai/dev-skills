name: pr-review (Codex)

# Reusable workflow: the pr-review pipeline, run on OpenAI Codex instead of
# Claude. Same agents, prompts and formatter as pr-review.yml; see
# plugins/pr-review/templates/pr-review-codex.yml, or run
# /pr-review:setup-gh-action and choose Codex.
#
# Differences from the Claude engine:
# - Each stage's output is its final message (`codex exec -o`), not a file
#   the model writes, so a stage can't "forget" to save its result. JSON
#   stages are cut out of the message by scripts/extract_json.py.
# - The model runs in Codex's read-only sandbox, and a permission profile
#   denies it the credentials file: a PR can try to talk the model into
#   printing secrets into the posted review, and this makes that impossible.
# - Only the login step ever sees the API key.

on:
  workflow_call:
    inputs:
      pr_number:
        description: "PR to review. Leave empty to take it from the triggering event."
        type: string
        default: ""
      trigger_phrase:
        description: "Comment text that triggers a review (members/collaborators only)."
        type: string
        default: "/pr-review"
      reviewers:
        description: "Built-in reviewers to run, space-separated."
        type: string
        default: "bugs arch quality simplify prod"
      extra_reviewers:
        description: "Your own reviewer specs, as paths in YOUR repo, space-separated."
        type: string
        default: ""
      model:
        description: "Codex model for every stage. Empty uses the Codex CLI's default."
        type: string
        default: ""
      models:
        description: >-
          JSON object overriding the model per stage, e.g. '{"validator":"<model>"}'.
          Keys: reviewer names, "impact", "validator".
        type: string
        default: "{}"
      runs_on:
        description: "Runner label(s) as JSON. The Codex sandbox needs a Linux runner with sudo for setup."
        type: string
        default: '"ubuntu-latest"'
      codex_cli_version:
        description: "Pinned Codex CLI version, so a CLI release never silently changes review behaviour."
        type: string
        default: "0.145.0"
      tooling_ref:
        description: "Ref of atlabsai/dev-skills to load agents, prompts and scripts from. Keep it equal to the ref in your `uses:` line."
        type: string
        default: "v1"
    secrets:
      openai_api_key:
        description: "OpenAI API key used by the Codex CLI."
        required: true

env:
  REVIEWER_CALL_TIMEOUT: "720"
  RETRY_CALL_TIMEOUT: "480"
  VALIDATOR_CALL_TIMEOUT: "600"
  SCRATCH: ${{ github.workspace }}/scratch
  TOOLING: ${{ github.workspace }}/tooling/plugins/pr-review

jobs:
  review:
    if: >-
      inputs.pr_number != '' ||
      (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && !github.event.pull_request.draft) ||
      (github.event.issue.pull_request != null &&
       github.event.issue.state == 'open' &&
       contains(github.event.comment.body, inputs.trigger_phrase) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    # Per-call ceilings fire first (fan-out 12 + one retry 8 + validate 10 +
    # ~3 setup/post), so a slow stage degrades the review instead of the job
    # being hard-cancelled with no comment and no debug artifact.
    timeout-minutes: 40
    steps:
      - name: Resolve PR
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          PR_NUMBER="${INPUT_PR:-$EVENT_PR}"
          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid,headRefName,baseRefName,title,body,state)
          if [ "$(jq -r .state <<< "$PR_JSON")" != "OPEN" ]; then
            echo "::error::PR #$PR_NUMBER is not open; nothing to review."
            exit 1
          fi
          {
            echo "pr_number=$PR_NUMBER"
            echo "head_sha=$(jq -r .headRefOid <<< "$PR_JSON")"
            echo "branch=$(jq -r .headRefName <<< "$PR_JSON")"
            echo "base=$(jq -r .baseRefName <<< "$PR_JSON")"
          } >> "$GITHUB_OUTPUT"
          mkdir -p "$SCRATCH/pr-context" "$SCRATCH/reviews" "$SCRATCH/logs"
          jq --argjson t "$(date +%s)" '{title, body, started_at: $t}' <<< "$PR_JSON" > "$SCRATCH/pr-context/meta.json"

      - name: Acknowledge trigger comment
        id: ack
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          if id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content=eyes --jq .id); then
            echo "reaction_id=$id" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: repo

      - uses: actions/checkout@v5
        with:
          repository: atlabsai/dev-skills
          ref: ${{ inputs.tooling_ref }}
          persist-credentials: false
          sparse-checkout: plugins/pr-review
          path: tooling

      - name: Capture PR diff
        working-directory: repo
        env:
          BASE: ${{ steps.resolve.outputs.base }}
        run: |
          # fetch-depth: 0 already fetched every branch; credentials are not
          # persisted, so fetching again would fail on private repos.
          git diff "origin/$BASE...HEAD" > "$SCRATCH/pr-context/diff.txt"
          echo "::notice::diff: $(wc -l < "$SCRATCH/pr-context/diff.txt") lines"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex CLI
        env:
          VERSION: ${{ inputs.codex_cli_version }}
        run: npm install -g "@openai/codex@$VERSION"

      - name: Enable the Codex sandbox
        run: |
          set -euo pipefail
          # Codex's Linux sandbox needs unprivileged user namespaces, which
          # Ubuntu runners restrict by default.
          if [ "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || echo 1)" != 1 ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Fail before spending any model quota if the sandbox can't start.
          codex sandbox /bin/true

      # All setup that needs sudo is done; revoke it before credentials exist,
      # as the official Codex action does.
      - name: Drop sudo
        run: |
          sudo -n sh -c "deluser '$USER' sudo >/dev/null 2>&1 || true; rm -f '/etc/sudoers.d/$USER'"
          if sudo -n true 2>/dev/null; then
            echo "::error::could not revoke passwordless sudo"
            exit 1
          fi

      - name: Log in to Codex
        env:
          OPENAI_API_KEY: ${{ secrets.openai_api_key }}
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Pass openai_api_key to this workflow."
            exit 1
          fi
          CODEX_HOME="$HOME/.codex-review"
          mkdir -p "$CODEX_HOME" && chmod 700 "$CODEX_HOME"
          echo "CODEX_HOME=$CODEX_HOME" >> "$GITHUB_ENV"
          # Read-only everywhere, and the credentials file unreadable by the
          # model: reviews read untrusted PR content and are posted publicly.
          {
            printf 'cli_auth_credentials_store = "file"\n'
            printf 'default_permissions = "review"\n\n'
            printf '[permissions.review]\n'
            printf 'extends = ":read-only"\n\n'
            printf '[permissions.review.filesystem]\n'
            printf '"%s" = "deny"\n' "$CODEX_HOME/auth.json"
          } > "$CODEX_HOME/config.toml"
          export CODEX_HOME
          printenv OPENAI_API_KEY | codex login --with-api-key >/dev/null

      - name: Resolve stages and models
        env:
          REVIEWERS: ${{ inputs.reviewers }}
          EXTRA_REVIEWERS: ${{ inputs.extra_reviewers }}
          MODEL: ${{ inputs.model }}
          MODELS: ${{ inputs.models }}
        run: |
          if ! OVERRIDES=$(jq -ce 'if type == "object" then . else error("not an object") end' <<< "$MODELS" 2>/dev/null); then
            echo "::warning::models input is not a JSON object; ignoring it"
            OVERRIDES='{}'
          fi
          STAGES=""
          for r in $REVIEWERS; do
            spec="$TOOLING/agents/reviewer-$r.md"
            [ -s "$spec" ] || { echo "::error::unknown built-in reviewer '$r'"; exit 1; }
            STAGES+="$r=$spec"$'\n'
          done
          for p in $EXTRA_REVIEWERS; do
            spec="$GITHUB_WORKSPACE/repo/$p"
            [ -s "$spec" ] || { echo "::error::extra reviewer spec not found: $p"; exit 1; }
            STAGES+="$(basename "$p" .md)=$spec"$'\n'
          done
          printf '%s' "$STAGES" > "$SCRATCH/stages.txt"
          NAMES=$(cut -d= -f1 "$SCRATCH/stages.txt" | tr '\n' ' ')
          UNKNOWN=$(jq -rn --argjson o "$OVERRIDES" --arg n "$NAMES impact validator" \
            '($o | keys) - ($n | split(" ")) | join(", ")')
          [ -z "$UNKNOWN" ] || echo "::warning::models has unknown stage(s), ignored: $UNKNOWN"
          # Only plausible model names are accepted: a value with a newline
          # would otherwise inject lines into $GITHUB_ENV.
          NAME_RE='^[A-Za-z0-9._:\[\]-]+$'
          if [ -n "$MODEL" ] && ! [[ "$MODEL" =~ $NAME_RE ]]; then
            echo "::warning::model input is not a valid model name; using the Codex default"
            MODEL=""
          fi
          for s in $NAMES impact validator; do
            m=$(jq -r --arg s "$s" '.[$s] | select(type == "string")' <<< "$OVERRIDES")
            if [ -n "$m" ] && ! [[ "$m" =~ $NAME_RE ]]; then
              echo "::warning::models.$s is not a valid model name; ignoring it" >&2
              m=""
            fi
            echo "MODEL_$(tr '[:lower:]-' '[:upper:]_' <<< "$s")=${m:-$MODEL}"
          done | tee -a "$GITHUB_ENV"

      - name: Run reviewers + impact analyst in parallel
        working-directory: repo
        run: |
          set +e
          prompt() {  # spec, extra
            sed -e "s|__SPEC__|$1|" -e "s|__SCRATCH__|$SCRATCH|g" -e "s|__EXTRA__|$2|" \
              "$TOOLING/prompts/stage-codex.md"
          }
          model_args() {  # stage -> "--model X", or nothing for the CLI default
            local v; v="MODEL_$(tr '[:lower:]-' '[:upper:]_' <<< "$1")"
            [ -z "${!v}" ] || printf -- '--model\n%s\n' "${!v}"
          }

          { sed 's|$|=reviews|' "$SCRATCH/stages.txt"; echo "impact=$TOOLING/agents/impact-analyst.md=impact"; } \
            | while IFS='=' read -r name spec kind; do
                if [ "$kind" = impact ]; then out="$SCRATCH/impact.json"; else out="$SCRATCH/reviews/$name.txt"; fi
                echo "$name=$spec=$out"
              done > "$SCRATCH/all-stages.txt"

          declare -A PIDS RC
          launch() {  # name, spec, output, per-call timeout, log name
            local args; mapfile -t args < <(model_args "$1")
            timeout "$4" codex exec "${args[@]}" --ephemeral -o "$3" "$(prompt "$2" "")" \
              > "$SCRATCH/logs/$5.log" 2>&1 &
            PIDS[$1]=$!
          }
          wait_all() {
            for t in "${!PIDS[@]}"; do wait "${PIDS[$t]}"; RC[$t]=$?; echo "$t exited rc=${RC[$t]}"; done
            PIDS=()
          }
          # The impact analysis must be a JSON object; anything else counts
          # as no output, so it is retried like a stage that wrote nothing.
          impact_usable() {
            if [ -s "$SCRATCH/impact.json" ] && python3 "$TOOLING/scripts/extract_json.py" "$SCRATCH/impact.json" object; then
              return 0
            fi
            rm -f "$SCRATCH/impact.json"
            return 1
          }

          while IFS='=' read -r name spec out; do
            launch "$name" "$spec" "$out" "$REVIEWER_CALL_TIMEOUT" "$name"
          done < "$SCRATCH/all-stages.txt"
          wait_all
          impact_usable

          # A stage killed by the timeout (124) already used its whole budget,
          # so it isn't retried; any other stage without output is, once.
          while IFS='=' read -r name spec out; do
            if [ ! -s "$out" ] && [ "${RC[$name]}" != 124 ]; then
              echo "::notice::retrying $name, which produced no usable output"
              launch "$name" "$spec" "$out" "$RETRY_CALL_TIMEOUT" "$name.retry"
            fi
          done < "$SCRATCH/all-stages.txt"
          wait_all
          impact_usable  # re-check: a retried impact analysis can come back as prose again

          while IFS='=' read -r name _ out; do
            [ -s "$out" ] || echo "::warning::$name produced no output"
          done < "$SCRATCH/all-stages.txt"

      - name: Validate findings
        working-directory: repo
        run: |
          EXTRA="Reviewer outputs to validate are the files in $SCRATCH/reviews/, one per reviewer, named after it. A reviewer with no file failed; skip it."
          PROMPT=$(sed -e "s|__SPEC__|$TOOLING/agents/validator.md|" -e "s|__SCRATCH__|$SCRATCH|g" \
            -e "s|__EXTRA__|$EXTRA|" "$TOOLING/prompts/stage-codex.md")
          ARGS=(); [ -z "$MODEL_VALIDATOR" ] || ARGS=(--model "$MODEL_VALIDATOR")
          timeout "$VALIDATOR_CALL_TIMEOUT" codex exec "${ARGS[@]}" --ephemeral -o "$SCRATCH/validated.json" "$PROMPT" \
            > "$SCRATCH/logs/validator.log" 2>&1
          echo "validator exited rc=$?"
          grep -E '^(DISMISSED|MERGED):' "$SCRATCH/validated.json" 2>/dev/null || true
          if ! python3 "$TOOLING/scripts/extract_json.py" "$SCRATCH/validated.json" array; then
            echo "::error::validator produced no JSON findings array; see the pr-review-debug artifact"
            exit 1
          fi

      - name: Remove Codex credentials
        if: always()
        run: rm -f -- "${CODEX_HOME:-/nonexistent}/auth.json"

      - name: Format review comment
        working-directory: repo
        env:
          PR: ${{ steps.resolve.outputs.pr_number }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
          TRIGGER: ${{ inputs.trigger_phrase }}
        run: |
          python3 "$TOOLING/scripts/format_review.py" \
            --run-dir "$SCRATCH" \
            --reviewers "$(cut -d= -f1 "$SCRATCH/stages.txt" | tr '\n' ' ')" \
            --pr "$PR" --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" \
            --rerun-hint "Comment \`$TRIGGER\` to re-run this review." > /dev/null
          sed -i 's|^🤖 PR Review —|🤖 PR Review (Codex) —|' "$SCRATCH/comment.md"

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.resolve.outputs.pr_number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$SCRATCH/comment.md"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-review-debug
          path: scratch
          if-no-files-found: warn
          retention-days: 7

      - name: Mark trigger result
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REACTION_ID: ${{ steps.ack.outputs.reaction_id }}
          STATUS: ${{ job.status }}
        run: |
          base="repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions"
          [ -z "$REACTION_ID" ] || gh api --method DELETE "$base/$REACTION_ID" || true
          gh api --method POST "$base" -f content="$([ "$STATUS" = success ] && echo '+1' || echo '-1')" >/dev/null || true
